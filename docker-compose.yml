version: '3.8'

services:
  # Entrypoint Edge Router
  gateway:
    image: python:3.11-slim
    volumes:
      - ./gateway:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn httpx redis && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - video_service_1
      - video_service_2

  # Microservice Node 1
  video_service_1:
    image: python:3.11-slim
    volumes:
      - ./video_service:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"

  # Microservice Node 2
  video_service_2:
    image: python:3.11-slim
    volumes:
      - ./video_service:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    ports:
      - "8002:8002"

  # Shared Cache / Registry State
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
